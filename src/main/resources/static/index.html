<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Currency Converter Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b1020;
      --card: #151d32;
      --field: #0f172a;
      --border: #2b3650;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #34d399;
      --danger: #f87171;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%,
          rgba(139, 92, 246, .20), transparent 40%),
        radial-gradient(ellipse at 90% 90%,
          rgba(59, 130, 246, .15), transparent 40%),
        var(--bg);
    }

    .container {
      width: 100%;
      max-width: 490px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      font-size: 23px;
      font-weight: 700;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-name span {
      color: #a78bfa;
    }

    .card {
      background: rgba(21, 29, 50, .96);
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      color: #a78bfa;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 33px);
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 10px 0 26px;
    }

    label {
      display: block;
      margin: 17px 0 9px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-width: 0;
      height: 51px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .15);
    }

    .currency-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr);
      gap: 10px;
      align-items: end;
    }

    .currency-row label {
      margin-top: 22px;
    }

    .swap-wrap {
      display: flex;
      align-items: end;
      padding-bottom: 1px;
    }

    #swap {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: #202943;
      color: #c4b5fd;
      font-size: 24px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    #swap:hover {
      background: #31264f;
      transform: rotate(180deg);
    }

    #convert {
      width: 100%;
      min-height: 53px;
      margin-top: 25px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(100deg, #8b5cf6, #6366f1);
      color: white;
      font-weight: 750;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(99, 102, 241, .22);
      transition: transform .2s, filter .2s;
    }

    #convert:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    #convert:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    #err {
      color: var(--danger);
      font-size: 13px;
      line-height: 1.5;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    #out {
      display: none;
      margin-top: 22px;
      padding: 22px 18px;
      border-radius: 16px;
      border: 1px solid rgba(52, 211, 153, .23);
      background: linear-gradient(
        145deg,
        rgba(52, 211, 153, .09),
        rgba(139, 92, 246, .08)
      );
      animation: appear .3s ease;
    }

    .result-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 9px;
    }

    #out .big {
      color: #6ee7b7;
      font-size: clamp(23px, 5vw, 29px);
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;
      letter-spacing: -.7px;
    }

    #out .small {
      color: #aebbd0;
      font-size: 12px;
      margin-top: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 20px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .card {
        padding: 22px 17px;
        border-radius: 20px;
      }

      .currency-row {
        grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
        gap: 7px;
      }

      #swap {
        width: 38px;
        height: 44px;
      }

      input, select {
        padding: 0 9px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">↗</div>
      <div class="brand-name">Currency<span>Pro</span></div>
    </div>

    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">Currency exchange</div>
      <h1 id="page-title">Convert your money.</h1>
      <p class="subtitle">
        Check the exchange rate and convert between currencies in seconds.
      </p>

      <label for="amount">Amount to convert</label>
      <input
        id="amount"
        type="number"
        min="0"
        step="any"
        value="1"
        placeholder="Enter amount"
        inputmode="decimal"
      >

      <div class="currency-row">
        <div>
          <label for="from">From</label>
          <select id="from" aria-label="Source currency"></select>
        </div>

        <div class="swap-wrap">
          <button
            id="swap"
            type="button"
            title="Swap currencies"
            aria-label="Swap source and target currencies"
          >⇄</button>
        </div>

        <div>
          <label for="to">To</label>
          <select id="to" aria-label="Target currency"></select>
        </div>
      </div>

      <button id="convert" type="button">Convert Currency →</button>

      <div id="err" role="alert" aria-live="polite"></div>

      <div id="out" aria-live="polite">
        <div class="result-label">Converted amount</div>
        <div class="big" id="result"></div>
        <div class="small" id="rate"></div>
        <div class="small" id="updated"></div>
      </div>
    </section>

    <footer class="footer">
      Simple. Fast. Convenient.<br>
      Exchange rates are subject to market changes.
    </footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    async function init() {
      try {
        const res = await fetch('/api/currencies');

        if (!res.ok) {
          throw new Error('Could not load currencies.');
        }

        const list = await res.json();

        if (!Array.isArray(list) || list.length === 0) {
          throw new Error('No currencies are available.');
        }

        for (const c of list) {
          $('from').add(new Option(c, c));
          $('to').add(new Option(c, c));
        }

        $('from').value = list.includes('USD') ? 'USD' : list[0];
        $('to').value = list.includes('INR')
          ? 'INR'
          : (list[1] || list[0]);

      } catch (e) {
        $('err').textContent =
          e.message || 'Failed to load currencies. Check the server.';
      }
    }

    async function convert() {
      $('err').textContent = '';

      const amountText = $('amount').value.trim();
      const amount = Number(amountText);

      if (
        amountText === '' ||
        !Number.isFinite(amount) ||
        amount < 0
      ) {
        $('err').textContent = 'Enter a valid, non-negative amount.';
        $('out').style.display = 'none';
        return;
      }

      if (!$('from').value || !$('to').value) {
        $('err').textContent = 'Please select both currencies.';
        return;
      }

      const params = new URLSearchParams({
        from: $('from').value,
        to: $('to').value,
        amount: amountText
      });

      $('convert').disabled = true;
      $('convert').textContent = 'Converting...';

      try {
        const res = await fetch('/api/convert?' + params);

        const d = await res.json();

        if (!res.ok) {
          throw new Error(d.message || 'Conversion failed.');
        }

        if (
          !Number.isFinite(Number(d.result)) ||
          !Number.isFinite(Number(d.rate))
        ) {
          throw new Error('The server returned an invalid exchange rate.');
        }

        $('result').textContent =
          `${Number(d.amount).toLocaleString()} ${d.from} = ` +
          `${Number(d.result).toLocaleString(undefined, {
            maximumFractionDigits: 6
          })} ${d.to}`;

        $('rate').textContent =
          `1 ${d.from} = ${d.rate} ${d.to}`;

        $('updated').textContent =
          'Rates updated: ' + (d.lastUpdated || 'Not provided');

        $('out').style.display = 'block';

      } catch (e) {
        $('out').style.display = 'none';
        $('err').textContent =
          e.message || 'Something went wrong. Please try again.';
      } finally {
        $('convert').disabled = false;
        $('convert').textContent = 'Convert Currency →';
      }
    }

    $('convert').addEventListener('click', convert);

    $('swap').addEventListener('click', () => {
      const from = $('from').value;
      $('from').value = $('to').value;
      $('to').value = from;

      if ($('from').value && $('to').value) {
        convert();
      }
    });

    $('amount').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        convert();
      }
    });

    init();
  </script>
</body>
</html>
